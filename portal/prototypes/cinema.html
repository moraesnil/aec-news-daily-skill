<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AEC NEWS Cinema</title>
<style>
  /* Tema único cinematográfico (escuro) — cores explícitas */
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #0A0A0E;
    color: #F0EFEA;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid #E8B34B; outline-offset: 3px; }
  button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .caps { text-transform: uppercase; letter-spacing: .22em; }

  /* ---------- Progress + dots ---------- */
  .progress { position: fixed; top: 0; left: 0; height: 3px; background: #E8B34B; width: 0; z-index: 60; }
  .dots { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; gap: 10px; padding: 10px 16px; background: rgba(10,10,14,.55); border: 1px solid rgba(240,239,234,.18); border-radius: 999px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .dots button { width: 9px; height: 9px; border-radius: 50%; background: rgba(240,239,234,.3); padding: 0; transition: background .3s, transform .3s; }
  .dots button:hover { background: rgba(240,239,234,.7); }
  .dots button.on { background: #E8B34B; transform: scale(1.35); }
  .hint { position: fixed; top: 18px; right: 22px; z-index: 60; font-size: 10px; color: rgba(240,239,234,.5); letter-spacing: .2em; text-transform: uppercase; }

  /* ---------- Filmstrip ---------- */
  .film { overflow: hidden; }
  .strip { display: flex; height: 100svh; width: max-content; }
  .panel { width: 100vw; height: 100svh; flex: none; position: relative; display: grid; place-items: center; overflow: hidden; padding: 60px clamp(20px, 5vw, 70px); }
  .panel-inner { max-width: 1040px; width: 100%; max-height: 100%; overflow-y: auto; scrollbar-width: thin; }

  /* Painel título */
  .p-title { text-align: center; }
  .p-title .date { font-size: 12px; color: #8E8D86; margin-bottom: 22px; }
  .p-title h1 { font-size: clamp(3.4rem, 12vw, 9.5rem); font-weight: 800; letter-spacing: -0.045em; line-height: .92; }
  .p-title h1 em { font-style: normal; color: #E8B34B; }
  .p-title .sub { margin-top: 22px; font-size: 1.1rem; color: #B9B8B0; }
  .p-title .roll { margin-top: 34px; font-size: 11px; color: #8E8D86; letter-spacing: .26em; text-transform: uppercase; }

  /* Painel destaque: imagem full-bleed */
  .p-feature { padding: 0; }
  .p-feature .bg { position: absolute; inset: 0; }
  .p-feature .bg img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.08); }
  .p-feature .scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6,6,10,.92) 0%, rgba(6,6,10,.55) 55%, rgba(6,6,10,.2) 100%); }
  .p-feature .txt { position: relative; align-self: end; justify-self: start; max-width: 720px; padding: 0 clamp(20px, 5vw, 70px) 70px; }
  .p-feature .kicker { color: #E8B34B; font-size: 12px; font-weight: 700; margin-bottom: 14px; }
  .p-feature h2 { font-size: clamp(1.9rem, 4.6vw, 3.6rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; margin-bottom: 16px; text-wrap: balance; }
  .p-feature p { color: #D8D7D0; font-size: 1.02rem; margin-bottom: 12px; max-width: 60ch; }
  .p-feature .src { font-size: 11px; color: #B9B8B0; letter-spacing: .12em; text-transform: uppercase; }
  .p-feature .src a { color: #E8B34B; text-decoration: none; }

  /* Painéis de seção */
  .p-sec .cat { font-size: 12px; color: #E8B34B; font-weight: 700; margin-bottom: 8px; }
  .p-sec h2 { font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 800; letter-spacing: -0.032em; margin-bottom: 30px; }
  .p-sec .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 18px; }
  .scard { background: #131319; border: 1px solid #26262e; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .3s; }
  .scard:hover { transform: translateY(-6px); border-color: #E8B34B; }
  .scard img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
  .scard .pad { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .scard .mt { font-size: 9.5px; color: #8E8D86; letter-spacing: .14em; text-transform: uppercase; }
  .scard h3 { font-size: .98rem; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }
  .scard h3 a { text-decoration: none; }
  .scard h3 a:hover { color: #E8B34B; }
  .scard p { font-size: .82rem; color: #B9B8B0; flex: 1; }

  /* Painel radar */
  .p-radar .rgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 16px; }
  .rc { background: #131319; border: 1px solid #26262e; border-radius: 18px; padding: 18px; }
  .rc .hz { font-size: 1.5rem; font-weight: 800; color: #E8B34B; letter-spacing: -0.02em; }
  .rc .m { font-size: 9px; color: #8E8D86; letter-spacing: .16em; text-transform: uppercase; margin: 4px 0 10px; }
  .rc .sg { font-size: 10px; color: #8E8D86; text-transform: uppercase; letter-spacing: .04em; line-height: 1.55; margin-bottom: 10px; }
  .rc p { font-size: .85rem; color: #D8D7D0; margin-bottom: 8px; }
  .rc .play { border-left: 2px solid #E8B34B; padding-left: 12px; }
  .rc .play b { color: #E8B34B; }

  /* Painel studio */
  .p-studio .sgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(290px, 100%), 1fr)); gap: 16px; }
  .sc { background: #131319; border: 1px solid #26262e; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .sc .pf { display: flex; align-items: center; gap: 12px; }
  .sc .pl { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #0A0A0E; background: #E8B34B; padding: 4px 12px; border-radius: 999px; }
  .sc .fm { font-size: 10px; color: #8E8D86; letter-spacing: .1em; text-transform: uppercase; }
  .sc h3 { font-size: 1.05rem; font-weight: 700; line-height: 1.3; letter-spacing: -0.012em; }
  .sc .draft { white-space: pre-wrap; font-size: .8rem; color: #B9B8B0; background: #0D0D12; border: 1px solid #26262e; border-radius: 12px; padding: 12px 14px; max-height: 180px; overflow-y: auto; }
  .sc button { align-self: flex-start; border: 1px solid rgba(240,239,234,.35); border-radius: 999px; padding: 7px 18px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .sc button:hover { background: #E8B34B; color: #0A0A0E; border-color: #E8B34B; }
  .sc button.done { background: #4CAF7D; border-color: #4CAF7D; color: #0A0A0E; }

  /* Painel final / arquivo */
  .p-end { text-align: center; }
  .p-end h2 { font-size: clamp(2rem, 6vw, 4rem); font-weight: 800; letter-spacing: -0.035em; margin-bottom: 26px; }
  .p-end h2 em { font-style: normal; color: #E8B34B; }
  .p-end .arch { max-width: 640px; margin: 0 auto; text-align: left; }
  .p-end .ai { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; padding: 14px 0; border-top: 1px solid #26262e; }
  .p-end .ai .d { font-weight: 800; }
  .p-end .ai .r { font-size: 10px; color: #8E8D86; letter-spacing: .14em; text-transform: uppercase; }
  .p-end .ai .h { flex: 1 1 100%; font-size: .9rem; color: #B9B8B0; }
  .p-end .ai.current .d { color: #E8B34B; }
  .p-end .fin { margin-top: 30px; font-size: 10px; color: #8E8D86; letter-spacing: .26em; text-transform: uppercase; }

  /* Notas dentro do painel radar */
  .ednote { margin-top: 18px; font-size: .9rem; color: #B9B8B0; border-top: 1px solid #26262e; padding-top: 14px; }
  .ednote strong { color: #E8B34B; }

  /* Fallback vertical (mobile / reduced motion / sem JS de pin) */
  body.vertical .strip { display: block; height: auto; width: auto; }
  body.vertical .panel { width: auto; height: auto; min-height: 60svh; padding-top: 70px; padding-bottom: 70px; }
  body.vertical .p-feature { min-height: 90svh; }
  body.vertical .dots, body.vertical .hint { display: none; }
</style>

<div class="progress" id="progress" aria-hidden="true"></div>
<div class="hint caps" id="hint">Role — a edição corre na horizontal</div>
<nav class="dots" id="dots" aria-label="Painéis"></nav>

<div class="film" id="film">
  <div class="strip" id="strip">

    <section class="panel p-title">
      <div>
        <div class="date caps" id="t-date"></div>
        <h1>AEC<em>·</em>NEWS</h1>
        <p class="sub" id="t-sub"></p>
        <div class="roll" id="t-roll"></div>
      </div>
    </section>

    <section class="panel p-feature" id="p-feature">
      <div class="bg" id="f-bg"></div>
      <div class="scrim"></div>
      <div class="txt">
        <div class="kicker caps" id="f-kicker"></div>
        <h2 id="f-title"></h2>
        <p id="f-p"></p>
        <div class="src" id="f-src"></div>
      </div>
    </section>

    <!-- painéis de seção injetados aqui -->

    <section class="panel p-radar" id="p-radar">
      <div class="panel-inner">
        <div class="cat caps">Radar estratégico</div>
        <h2 style="font-size:clamp(1.8rem,4.4vw,3rem);font-weight:800;letter-spacing:-.03em;margin-bottom:24px">Sinal → Leitura → Jogada</h2>
        <div class="rgrid" id="radar-grid"></div>
        <div class="ednote" id="notes-body"></div>
      </div>
    </section>

    <section class="panel p-studio" id="p-studio">
      <div class="panel-inner">
        <div class="cat caps" style="color:#E8B34B;font-size:12px;font-weight:700;margin-bottom:8px">Estúdio de conteúdo</div>
        <h2 style="font-size:clamp(1.8rem,4.4vw,3rem);font-weight:800;letter-spacing:-.03em;margin-bottom:24px">Pronto para publicar</h2>
        <div class="sgrid" id="studio-list"></div>
      </div>
    </section>

    <section class="panel p-end">
      <div class="panel-inner">
        <h2>Fim da edição<em>.</em></h2>
        <div class="arch" id="arch-list"></div>
        <div class="fin">AEC·NEWS — amanhã tem outra — gerado por IA</div>
      </div>
    </section>

  </div>
</div>

<noscript><p style="max-width:60ch;margin:40px auto;text-align:center;color:#F0EFEA">Este portal renderiza via JavaScript. Habilite JS.</p></noscript>

<script>__LIB_GSAP__</script>
<script>__LIB_SCROLLTRIGGER__</script>
<script type="application/json" id="aec-data">__AEC_DATA__</script>

<script>
(function () {
  var data = JSON.parse(document.getElementById('aec-data').textContent);

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  document.getElementById('t-date').textContent = data.meta.date_long;
  document.getElementById('t-sub').textContent =
    'Uma edição, ' + data.meta.story_count + ' histórias, ' + data.meta.sources_active + ' fontes.';
  document.getElementById('t-roll').textContent = 'Edição ' + data.meta.revision + ' · Escala 1:DIA';

  /* Feature */
  if (data.hero.image) {
    var img = document.createElement('img');
    img.src = data.hero.image; img.alt = '';
    document.getElementById('f-bg').appendChild(img);
  }
  document.getElementById('f-kicker').textContent = data.hero.kicker;
  document.getElementById('f-title').textContent = data.hero.title;
  document.getElementById('f-p').textContent = data.hero.paragraphs[0];
  var fsrc = document.getElementById('f-src');
  fsrc.appendChild(document.createTextNode('Fonte: '));
  var fa = el('a', null, data.hero.source);
  fa.href = data.hero.url; fa.target = '_blank'; fa.rel = 'noopener';
  fsrc.appendChild(fa);
  fsrc.appendChild(document.createTextNode(' · ' + data.hero.date));

  /* Painéis de seção */
  var strip = document.getElementById('strip');
  var radarPanel = document.getElementById('p-radar');
  data.sections.forEach(function (sec, si) {
    var p = el('section', 'panel p-sec');
    var inner = el('div', 'panel-inner');
    inner.appendChild(el('div', 'cat caps', 'Capítulo ' + String(si + 1).padStart(2, '0')));
    inner.appendChild(el('h2', null, sec.name));
    var cards = el('div', 'cards');
    sec.items.forEach(function (item) {
      var c = el('article', 'scard');
      if (item.image) {
        var img = document.createElement('img');
        img.src = item.image; img.alt = item.title; img.loading = 'lazy';
        c.appendChild(img);
      }
      var pad = el('div', 'pad');
      pad.appendChild(el('div', 'mt', item.source + ' · ' + item.date));
      var h = el('h3');
      var a = el('a', null, item.title);
      a.href = item.url; a.target = '_blank'; a.rel = 'noopener';
      h.appendChild(a);
      pad.appendChild(h);
      pad.appendChild(el('p', null, item.summary));
      c.appendChild(pad);
      cards.appendChild(c);
    });
    inner.appendChild(cards);
    p.appendChild(inner);
    strip.insertBefore(p, radarPanel);
  });

  /* Radar */
  var rg = document.getElementById('radar-grid');
  ((data.radar || {}).cards || []).forEach(function (c) {
    var rc = el('article', 'rc');
    rc.appendChild(el('div', 'hz', c.horizon));
    rc.appendChild(el('div', 'm', 'Impacto ' + c.impact + '/3 · Esforço ' + c.effort + '/3 · ' + (c.refs || []).join(', ')));
    rc.appendChild(el('div', 'sg', c.signal));
    rc.appendChild(el('p', null, c.reading));
    var play = el('p', 'play');
    var b = el('b', null, 'Jogada: ');
    play.appendChild(b);
    play.appendChild(document.createTextNode(c.play));
    rc.appendChild(play);
    rg.appendChild(rc);
  });
  var nb = document.getElementById('notes-body');
  (data.editor_notes || []).forEach(function (note) {
    var p = document.createElement('p');
    p.innerHTML = note;
    p.style.marginBottom = '8px';
    nb.appendChild(p);
  });

  /* Studio */
  var sl = document.getElementById('studio-list');
  ((data.studio || {}).seeds || []).forEach(function (s) {
    var sc = el('article', 'sc');
    var pf = el('div', 'pf');
    pf.appendChild(el('span', 'pl', s.platform));
    pf.appendChild(el('span', 'fm', s.format));
    sc.appendChild(pf);
    sc.appendChild(el('h3', null, s.hook));
    sc.appendChild(el('div', 'draft', s.draft));
    var btn = el('button', null, 'Copiar');
    btn.type = 'button';
    btn.addEventListener('click', function () {
      var full = s.hook + '\n\n' + s.draft + '\n\n' + (s.hashtags || []).join(' ');
      function done() {
        btn.textContent = 'Copiado ✓'; btn.classList.add('done');
        setTimeout(function () { btn.textContent = 'Copiar'; btn.classList.remove('done'); }, 2000);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(full).then(done, done);
      else done();
    });
    sc.appendChild(btn);
    sl.appendChild(sc);
  });

  /* Arquivo */
  var archive = data.archive || [{ date: data.meta.date, revision: data.meta.revision, stories: data.meta.story_count, headline: data.hero.title }];
  var al = document.getElementById('arch-list');
  archive.forEach(function (ed, i) {
    var it = el('div', 'ai' + (i === 0 ? ' current' : ''));
    it.appendChild(el('span', 'd', ed.date));
    it.appendChild(el('span', 'r', ed.revision + ' · ' + ed.stories + ' notícias'));
    it.appendChild(el('span', 'h', ed.headline));
    al.appendChild(it);
  });

  /* ---------- Horizontal scroll (GSAP) ---------- */
  var panels = document.querySelectorAll('.panel');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var narrow = window.matchMedia('(max-width: 860px)').matches;
  var dots = document.getElementById('dots');
  var progress = document.getElementById('progress');

  if (window.gsap && !reduced && !narrow) {
    gsap.registerPlugin(ScrollTrigger);
    var n = panels.length;
    var mainST;
    gsap.to('#strip', {
      x: function () { return -(window.innerWidth * (n - 1)); },
      ease: 'none',
      scrollTrigger: {
        trigger: '#film', pin: true, scrub: 0.6, invalidateOnRefresh: true,
        end: function () { return '+=' + (window.innerWidth * (n - 1)); },
        snap: { snapTo: 1 / (n - 1), duration: { min: .15, max: .45 }, ease: 'power1.inOut' },
        onUpdate: function (st) {
          progress.style.width = (st.progress * 100) + '%';
          var idx = Math.round(st.progress * (n - 1));
          dots.querySelectorAll('button').forEach(function (b, i) { b.classList.toggle('on', i === idx); });
        },
        onRefresh: function (st) { mainST = st; }
      }
    });
    function goTo(idx) {
      if (!mainST) return;
      idx = Math.max(0, Math.min(n - 1, idx));
      var y = mainST.start + (mainST.end - mainST.start) * (idx / (n - 1));
      window.scrollTo({ top: y, behavior: 'smooth' });
    }
    panels.forEach(function (p, i) {
      var b = el('button');
      b.type = 'button';
      b.setAttribute('aria-label', 'Painel ' + (i + 1));
      b.addEventListener('click', function () { goTo(i); });
      dots.appendChild(b);
    });
    if (dots.firstChild) dots.firstChild.classList.add('on');

    window.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      if (!mainST) return;
      var idx = Math.round(mainST.progress * (n - 1)) + (e.key === 'ArrowRight' ? 1 : -1);
      goTo(idx);
    });

    gsap.fromTo('#f-bg img', { scale: 1.16 }, {
      scale: 1.02, ease: 'none',
      scrollTrigger: { trigger: '#film', start: 'top top', end: function () { return '+=' + window.innerWidth * 2; }, scrub: true }
    });
  } else {
    document.body.classList.add('vertical');
    progress.style.display = 'none';
    document.getElementById('hint').style.display = 'none';
  }
})();
</script>
