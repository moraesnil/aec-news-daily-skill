<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AEC NEWS Vision</title>
<style>
  /* Design de tema único (mundo espacial escuro) — todas as cores explícitas */
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: #05070D;
    color: #EDF2FA;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid #7DD3FF; outline-offset: 3px; border-radius: 6px; }
  button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  #bg { position: fixed; inset: 0; z-index: 0; }
  .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 90% 60% at 50% 0%, rgba(5,7,13,0) 0%, rgba(5,7,13,.55) 70%, rgba(5,7,13,.92) 100%); }

  .stage { position: relative; z-index: 2; max-width: 1120px; margin: 0 auto; padding: 0 22px 150px; }

  /* ---------- Glass ---------- */
  .glass {
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 26px;
    -webkit-backdrop-filter: blur(22px) saturate(1.4);
    backdrop-filter: blur(22px) saturate(1.4);
    box-shadow: 0 24px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
  }

  /* ---------- Hero ---------- */
  .hero { min-height: 92svh; display: grid; place-items: center; text-align: center; padding: 70px 0 30px; }
  .hero .date { font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: #8FA3BF; margin-bottom: 20px; }
  .hero h1 {
    font-size: clamp(3rem, 10vw, 7.4rem);
    font-weight: 800; letter-spacing: -0.04em; line-height: .96;
    color: #F4F8FF;
    text-shadow: 0 0 44px rgba(125,211,255,.32);
  }
  .hero h1 span { color: #7DD3FF; }
  .hero .sub { margin-top: 20px; font-size: 1.12rem; color: #AAB9CE; max-width: 46ch; }
  .hero .stats { margin-top: 26px; display: inline-flex; gap: 26px; padding: 12px 26px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #C8D6E8; }

  .view[hidden] { display: none; }
  .panel-h { font-size: clamp(1.6rem, 4vw, 2.5rem); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px; }
  .panel-sub { color: #8FA3BF; margin-bottom: 30px; max-width: 62ch; }

  /* ---------- Feature panel ---------- */
  .feature { padding: clamp(24px, 4vw, 44px); margin-bottom: 40px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 36px; align-items: center; }
  .feature .kicker { color: #7DD3FF; font-size: 11.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 14px; }
  .feature h2 { font-size: clamp(1.6rem, 3.6vw, 2.6rem); font-weight: 800; letter-spacing: -0.028em; line-height: 1.05; margin-bottom: 16px; text-wrap: balance; }
  .feature p { color: #C3D0E0; font-size: .98rem; margin-bottom: 12px; }
  .feature ul { list-style: none; padding: 0; margin: 16px 0; }
  .feature li { padding: 9px 0 9px 26px; position: relative; font-size: .93rem; color: #DEE8F4; border-top: 1px solid rgba(255,255,255,.09); }
  .feature li::before { content: "◆"; position: absolute; left: 2px; color: #7DD3FF; font-size: 10px; top: 12px; }
  .feature .src { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #8FA3BF; }
  .feature .src a { color: #7DD3FF; text-decoration: none; }
  .feature .media { border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,.14); transform: perspective(1100px) rotateY(-7deg); box-shadow: 0 30px 70px rgba(0,0,0,.5); }
  .feature .media img { width: 100%; display: block; }

  /* ---------- Constellation grid ---------- */
  .sec-label { display: flex; align-items: center; gap: 16px; margin: 46px 0 20px; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: #AAB9CE; }
  .sec-label::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,.28), transparent); }
  .sec-label .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cat, #7DD3FF); box-shadow: 0 0 14px var(--cat, #7DD3FF); }
  .ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 20px; }
  .gcard { padding: 18px; display: flex; flex-direction: column; gap: 12px; transition: transform .4s cubic-bezier(.2,.8,.2,1), border-color .3s, background .3s; will-change: transform; }
  .gcard:hover { transform: translateY(-8px); border-color: rgba(125,211,255,.4); background: rgba(255,255,255,.085); }
  .gcard img { width: 100%; aspect-ratio: 3/2; object-fit: cover; display: block; border-radius: 14px; }
  .gcard .tag { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--cat, #7DD3FF); font-weight: 700; }
  .gcard h3 { font-size: 1.05rem; font-weight: 700; line-height: 1.3; letter-spacing: -0.012em; }
  .gcard h3 a { text-decoration: none; }
  .gcard h3 a:hover { color: #7DD3FF; }
  .gcard p { font-size: .88rem; color: #AAB9CE; flex: 1; }
  .gcard .meta { font-size: 10.5px; color: #8FA3BF; letter-spacing: .08em; text-transform: uppercase; }

  .notes { margin-top: 46px; padding: clamp(22px, 4vw, 40px); }
  .notes h2 { font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: #7DD3FF; margin-bottom: 16px; }
  .notes p { color: #D6E1EF; font-size: 1.05rem; margin-bottom: 12px; max-width: 74ch; }
  .notes p strong { color: #F4F8FF; }

  /* ---------- Radar orbit cards ---------- */
  .rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 20px; }
  .rcard { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .rhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .hzpill { font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(125,211,255,.55); color: #7DD3FF; }
  .hzpill.now { background: #7DD3FF; color: #05070D; }
  .gauge { display: flex; gap: 14px; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: #8FA3BF; }
  .gauge .dots { letter-spacing: .18em; color: #7DD3FF; }
  .rcard .signal { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8FA3BF; line-height: 1.6; border-left: 2px solid rgba(125,211,255,.5); padding-left: 12px; }
  .rcard .k { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: #7DD3FF; font-weight: 700; margin-bottom: 4px; }
  .rcard p { font-size: .93rem; color: #D6E1EF; }
  .rcard .refs { margin-top: auto; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #8FA3BF; }

  /* ---------- Studio ---------- */
  .seed { padding: clamp(22px, 4vw, 36px); margin-bottom: 22px; }
  .seed-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 16px; }
  .seed-platform { font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #05070D; background: #7DD3FF; padding: 5px 13px; border-radius: 999px; }
  .seed-format { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #8FA3BF; }
  .seed-copy { margin-left: auto; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 8px 20px; font-size: 12px; font-weight: 600; transition: background .25s, color .25s, transform .2s; }
  .seed-copy:hover { background: #EDF2FA; color: #05070D; transform: scale(1.04); }
  .seed-copy.done { background: #4ADE80; color: #05070D; border-color: #4ADE80; }
  .seed-hook { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.018em; line-height: 1.3; margin-bottom: 14px; max-width: 52ch; }
  .seed-draft { white-space: pre-wrap; font-size: .93rem; color: #D6E1EF; background: rgba(0,0,0,.32); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 20px 22px; max-width: 76ch; overflow-x: auto; }
  .seed-tags { margin-top: 12px; font-size: 11px; color: #7DD3FF; }

  /* ---------- Arquivo ---------- */
  .aitem { display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: baseline; padding: 18px 22px; margin-bottom: 12px; }
  .aitem .d { font-weight: 700; }
  .aitem .r { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #8FA3BF; }
  .aitem .h { flex: 1 1 100%; color: #AAB9CE; font-size: .95rem; }
  .aitem.current .d { color: #7DD3FF; }

  /* ---------- Dock ---------- */
  .dock {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 40;
    display: flex; gap: 4px; padding: 7px;
    border-radius: 999px;
  }
  .dock button {
    font-size: 12.5px; font-weight: 600; color: #C8D6E8;
    padding: 10px 20px; border-radius: 999px;
    transition: background .25s, color .25s, transform .2s;
  }
  .dock button:hover { color: #F4F8FF; transform: translateY(-2px); }
  .dock button[aria-selected="true"] { background: #EDF2FA; color: #05070D; }

  .foot { position: relative; z-index: 2; text-align: center; padding: 10px 20px 40px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #66788F; }

  @media (max-width: 820px) {
    .feature { grid-template-columns: 1fr; }
    .feature .media { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .gcard, .gcard:hover, .seed-copy, .dock button { transition: none; transform: none; }
  }
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<div class="stage">
  <header class="hero">
    <div>
      <div class="date" id="hero-date"></div>
      <h1>AEC<span>·</span>NEWS</h1>
      <p class="sub">A camada de notícias sobre a cidade. Arquitetura, engenharia e construção — curadas todos os dias por IA.</p>
      <div class="stats glass" id="hero-stats"></div>
    </div>
  </header>

  <section class="view" id="view-edicao" role="tabpanel" aria-label="Edição">
    <article class="feature glass" id="feature">
      <div id="f-txt"></div>
      <div class="media" id="f-media"></div>
    </article>
    <div id="sections"></div>
    <aside class="notes glass">
      <h2>Notas do editor</h2>
      <div id="notes-body"></div>
    </aside>
  </section>

  <section class="view" id="view-radar" role="tabpanel" aria-label="Radar" hidden>
    <h2 class="panel-h">Radar estratégico</h2>
    <p class="panel-sub" id="radar-intro"></p>
    <div class="rgrid" id="radar-grid"></div>
  </section>

  <section class="view" id="view-conteudo" role="tabpanel" aria-label="Conteúdo" hidden>
    <h2 class="panel-h">Estúdio de conteúdo</h2>
    <p class="panel-sub" id="studio-intro"></p>
    <div id="studio-list"></div>
  </section>

  <section class="view" id="view-arquivo" role="tabpanel" aria-label="Arquivo" hidden>
    <h2 class="panel-h">Arquivo</h2>
    <p class="panel-sub">Uma edição por dia, sempre nesta URL.</p>
    <div id="arch-list"></div>
  </section>
</div>

<nav class="dock glass" role="tablist" aria-label="Vistas" id="dock"></nav>
<footer class="foot">AEC·NEWS — gerado por IA a partir de fontes curadas</footer>

<noscript><p style="max-width:60ch;margin:80px auto;text-align:center;color:#EDF2FA">Este portal renderiza via JavaScript. Habilite JS.</p></noscript>

<script>__LIB_THREE__</script>
<script type="application/json" id="aec-data">__AEC_DATA__</script>

<script>
(function () {
  var data = JSON.parse(document.getElementById('aec-data').textContent);
  var CATC = { arq: '#7DD3FF', eng: '#FF9E6E', tec: '#C9A6FF', bra: '#7DE8A8' };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  document.getElementById('hero-date').textContent = data.meta.date_long;
  var hs = document.getElementById('hero-stats');
  [data.meta.story_count + ' notícias', data.meta.sources_active + ' fontes', 'Edição ' + data.meta.revision]
    .forEach(function (t) { hs.appendChild(el('span', null, t)); });

  /* ---------- Dock tabs ---------- */
  var VIEWS = [
    { id: 'edicao', name: 'Edição' },
    { id: 'radar', name: 'Radar' },
    { id: 'conteudo', name: 'Conteúdo' },
    { id: 'arquivo', name: 'Arquivo' }
  ];
  var dock = document.getElementById('dock');
  VIEWS.forEach(function (v) {
    var b = el('button', null, v.name);
    b.type = 'button'; b.id = 'tab-' + v.id;
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', 'false');
    b.setAttribute('aria-controls', 'view-' + v.id);
    b.addEventListener('click', function () { show(v.id, true); });
    dock.appendChild(b);
  });
  function show(id, push) {
    VIEWS.forEach(function (v) {
      document.getElementById('view-' + v.id).hidden = v.id !== id;
      document.getElementById('tab-' + v.id).setAttribute('aria-selected', String(v.id === id));
    });
    if (push) {
      if (history.replaceState) history.replaceState(null, '', '#' + id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }
  window.addEventListener('hashchange', function () {
    var id = location.hash.slice(1);
    if (VIEWS.some(function (v) { return v.id === id; })) show(id, false);
  });
  var initial = location.hash.slice(1);
  show(VIEWS.some(function (v) { return v.id === initial; }) ? initial : 'edicao', false);

  /* ---------- Feature ---------- */
  var ft = document.getElementById('f-txt');
  ft.appendChild(el('div', 'kicker', data.hero.kicker));
  ft.appendChild(el('h2', null, data.hero.title));
  ft.appendChild(el('p', null, data.hero.paragraphs[0]));
  var ul = el('ul');
  data.hero.points.forEach(function (pt) { ul.appendChild(el('li', null, pt)); });
  ft.appendChild(ul);
  var src = el('div', 'src');
  src.appendChild(document.createTextNode('Fonte: '));
  var a = el('a', null, data.hero.source);
  a.href = data.hero.url; a.target = '_blank'; a.rel = 'noopener';
  src.appendChild(a);
  src.appendChild(document.createTextNode(' · ' + data.hero.date));
  ft.appendChild(src);
  if (data.hero.image) {
    var img = document.createElement('img');
    img.src = data.hero.image; img.alt = data.hero.title;
    document.getElementById('f-media').appendChild(img);
  }

  /* ---------- Sections ---------- */
  var main = document.getElementById('sections');
  data.sections.forEach(function (sec) {
    var lab = el('div', 'sec-label');
    lab.style.setProperty('--cat', CATC[sec.id]);
    lab.appendChild(el('i', 'dot'));
    lab.appendChild(el('span', null, sec.name + ' — ' + String(sec.items.length).padStart(2, '0')));
    main.appendChild(lab);
    var grid = el('div', 'ggrid');
    sec.items.forEach(function (item) {
      var c = el('article', 'gcard glass');
      c.style.setProperty('--cat', CATC[sec.id]);
      if (item.image) {
        var img = document.createElement('img');
        img.src = item.image; img.alt = item.title; img.loading = 'lazy';
        c.appendChild(img);
      }
      c.appendChild(el('div', 'tag', item.source));
      var h = el('h3');
      var ha = el('a', null, item.title);
      ha.href = item.url; ha.target = '_blank'; ha.rel = 'noopener';
      h.appendChild(ha);
      c.appendChild(h);
      c.appendChild(el('p', null, item.summary));
      c.appendChild(el('div', 'meta', item.date));
      grid.appendChild(c);
    });
    main.appendChild(grid);
  });

  /* ---------- Notes ---------- */
  var nb = document.getElementById('notes-body');
  (data.editor_notes || []).forEach(function (note) {
    var p = document.createElement('p');
    p.innerHTML = note;
    nb.appendChild(p);
  });

  /* ---------- Radar ---------- */
  document.getElementById('radar-intro').textContent = (data.radar || {}).intro || '';
  var rg = document.getElementById('radar-grid');
  ((data.radar || {}).cards || []).forEach(function (c) {
    var card = el('article', 'rcard glass');
    var head = el('div', 'rhead');
    head.appendChild(el('span', 'hzpill' + (c.horizon === 'AGORA' ? ' now' : ''), c.horizon));
    var g = el('div', 'gauge');
    [['Impacto', c.impact], ['Esforço', c.effort]].forEach(function (m) {
      var s = el('span');
      s.appendChild(document.createTextNode(m[0] + ' '));
      s.appendChild(el('span', 'dots', '●'.repeat(m[1]) + '○'.repeat(3 - m[1])));
      g.appendChild(s);
    });
    head.appendChild(g);
    card.appendChild(head);
    card.appendChild(el('div', 'signal', c.signal));
    var b1 = el('div');
    b1.appendChild(el('div', 'k', 'Leitura'));
    b1.appendChild(el('p', null, c.reading));
    card.appendChild(b1);
    var b2 = el('div');
    b2.appendChild(el('div', 'k', 'Jogada'));
    b2.appendChild(el('p', null, c.play));
    card.appendChild(b2);
    card.appendChild(el('div', 'refs', 'Ref: ' + (c.refs || []).join(' · ')));
    rg.appendChild(card);
  });

  /* ---------- Studio ---------- */
  document.getElementById('studio-intro').textContent = (data.studio || {}).intro || '';
  var sl = document.getElementById('studio-list');
  ((data.studio || {}).seeds || []).forEach(function (s) {
    var seed = el('article', 'seed glass');
    var head = el('div', 'seed-head');
    head.appendChild(el('span', 'seed-platform', s.platform));
    head.appendChild(el('span', 'seed-format', s.format));
    var btn = el('button', 'seed-copy', 'Copiar');
    btn.type = 'button';
    btn.addEventListener('click', function () {
      var full = s.hook + '\n\n' + s.draft + '\n\n' + (s.hashtags || []).join(' ');
      function done() {
        btn.textContent = 'Copiado ✓'; btn.classList.add('done');
        setTimeout(function () { btn.textContent = 'Copiar'; btn.classList.remove('done'); }, 2000);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(full).then(done, done);
      else done();
    });
    head.appendChild(btn);
    seed.appendChild(head);
    seed.appendChild(el('h3', 'seed-hook', s.hook));
    seed.appendChild(el('div', 'seed-draft', s.draft));
    seed.appendChild(el('div', 'seed-tags', (s.hashtags || []).join('  ')));
    sl.appendChild(seed);
  });

  /* ---------- Arquivo ---------- */
  var archive = data.archive || [{ date: data.meta.date, revision: data.meta.revision, stories: data.meta.story_count, headline: data.hero.title }];
  var al = document.getElementById('arch-list');
  archive.forEach(function (ed, i) {
    var it = el('div', 'aitem glass' + (i === 0 ? ' current' : ''));
    it.appendChild(el('span', 'd', ed.date));
    it.appendChild(el('span', 'r', ed.revision + ' · ' + ed.stories + ' notícias'));
    it.appendChild(el('span', 'h', ed.headline));
    al.appendChild(it);
  });

  /* ---------- Three.js: cidade wireframe + partículas ---------- */
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (window.THREE) {
    var canvas = document.getElementById('bg');
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    var scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x05070d, 30, 150);
    var camera = new THREE.PerspectiveCamera(55, 1, 0.1, 400);
    camera.position.set(0, 16, 52);

    var city = new THREE.Group();
    var mat = new THREE.LineBasicMaterial({ color: 0x2a4a72, transparent: true, opacity: 0.55 });
    var matHi = new THREE.LineBasicMaterial({ color: 0x7dd3ff, transparent: true, opacity: 0.8 });
    var rng = (function (s) { return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; })(42);
    for (var gx = -9; gx <= 9; gx++) {
      for (var gz = -9; gz <= 9; gz++) {
        if (rng() < 0.42) continue;
        var h = 1.5 + rng() * rng() * 22;
        var w = 2 + rng() * 2.4;
        var geo = new THREE.BoxGeometry(w, h, w);
        var edges = new THREE.EdgesGeometry(geo);
        var line = new THREE.LineSegments(edges, rng() > 0.93 ? matHi : mat);
        line.position.set(gx * 5.4 + (rng() - 0.5) * 1.6, h / 2, gz * 5.4 + (rng() - 0.5) * 1.6);
        city.add(line);
      }
    }
    var gridGeo = new THREE.PlaneGeometry(220, 220, 44, 44);
    var grid = new THREE.LineSegments(new THREE.WireframeGeometry(gridGeo),
      new THREE.LineBasicMaterial({ color: 0x16283f, transparent: true, opacity: 0.5 }));
    grid.rotation.x = -Math.PI / 2;
    city.add(grid);
    scene.add(city);

    var pGeo = new THREE.BufferGeometry();
    var N = 700, pos = new Float32Array(N * 3);
    for (var i = 0; i < N; i++) {
      pos[i * 3] = (rng() - 0.5) * 190;
      pos[i * 3 + 1] = rng() * 70;
      pos[i * 3 + 2] = (rng() - 0.5) * 190;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var stars = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0x8fc9ff, size: 0.55, transparent: true, opacity: 0.65 }));
    scene.add(stars);

    var mx = 0, my = 0;
    window.addEventListener('pointermove', function (e) {
      mx = (e.clientX / window.innerWidth - 0.5) * 2;
      my = (e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });

    function resize() {
      var w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    var t = 0;
    function frame() {
      t += 0.0016;
      city.rotation.y = t * 0.5 + mx * 0.06;
      camera.position.y = 16 + Math.sin(t * 2) * 1.2 - my * 2.4;
      camera.position.x = mx * 4;
      camera.lookAt(0, 6, 0);
      stars.rotation.y = -t * 0.18;
      renderer.render(scene, camera);
      if (!reduced) requestAnimationFrame(frame);
    }
    frame();
    if (reduced) renderer.render(scene, camera);
  }
})();
</script>
