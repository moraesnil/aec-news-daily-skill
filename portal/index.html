<script>
(function () {
  var data = JSON.parse(document.getElementById('aec-data').textContent);
  var CAT = { arq: '--c-arq', eng: '--c-eng', tec: '--c-tec', bra: '--c-bra' };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  /* Title block */
  var tb = document.getElementById('tblock');
  [['Folha', data.meta.sheet], ['Revisão', data.meta.revision], ['Data', data.meta.date], ['Escala', data.meta.scale]]
    .forEach(function (row) {
      tb.appendChild(el('div', 'k', row[0]));
      tb.appendChild(el('div', null, row[1]));
    });

  /* Hero */
  var hero = document.getElementById('hero');
  var hm = el('div', 'marker');
  hm.style.setProperty('--cat', 'var(--accent)');
  hm.appendChild(el('span', 'mono', data.hero.marker[0]));
  hm.appendChild(el('span', 'mono', data.hero.marker[1]));
  hero.appendChild(hm);
  var hb = el('div', 'hero-body');
  hb.appendChild(el('div', 'kicker mono', data.hero.kicker + ' · ' + data.meta.date_long));
  hb.appendChild(el('h1', null, data.hero.title));
  data.hero.paragraphs.forEach(function (p) { hb.appendChild(el('p', null, p)); });
  var ul = el('ul');
  data.hero.points.forEach(function (pt) { ul.appendChild(el('li', null, pt)); });
  hb.appendChild(ul);
  var src = el('div', 'srcline mono');
  src.appendChild(document.createTextNode('FONTE: '));
  var a = el('a', null, data.hero.source);
  a.href = data.hero.url; a.target = '_blank'; a.rel = 'noopener';
  src.appendChild(a);
  src.appendChild(document.createTextNode(' · ' + data.hero.date));
  hb.appendChild(src);
  hero.appendChild(hb);

  /* Sections */
  var main = document.getElementById('sections');
  data.sections.forEach(function (sec) {
    var wrap = el('section');
    wrap.dataset.cat = sec.id;
    wrap.setAttribute('aria-label', sec.name);
    var catVar = 'var(' + CAT[sec.id] + ')';

    var dim = el('div', 'dim');
    dim.style.setProperty('--cat', catVar);
    dim.appendChild(el('i', 'tick'));
    dim.appendChild(el('i', 'ln'));
    var lbl = el('span', 'lbl mono');
    lbl.appendChild(document.createTextNode(sec.name + ' · '));
    var n = el('span', 'n', String(sec.items.length).padStart(2, '0'));
    lbl.appendChild(n);
    dim.appendChild(lbl);
    dim.appendChild(el('i', 'ln'));
    dim.appendChild(el('i', 'tick'));
    wrap.appendChild(dim);

    var grid = el('div', 'cards');
    sec.items.forEach(function (item, i) {
      var card = el('article', 'card');
      card.style.setProperty('--cat', catVar);
      var top = el('div', 'card-top');
      var mk = el('div', 'marker');
      mk.appendChild(el('span', 'mono', sec.code));
      mk.appendChild(el('span', 'mono', String(i + 1).padStart(2, '0')));
      top.appendChild(mk);
      var meta = el('div', 'card-meta mono');
      meta.appendChild(document.createTextNode(item.source));
      meta.appendChild(el('br'));
      meta.appendChild(document.createTextNode(item.date));
      top.appendChild(meta);
      card.appendChild(top);
      var h = el('h3');
      var ha = el('a', null, item.title);
      ha.href = item.url; ha.target = '_blank'; ha.rel = 'noopener';
      h.appendChild(ha);
      card.appendChild(h);
      card.appendChild(el('p', null, item.summary));
      var go = el('a', 'go mono', 'Ler na fonte →');
      go.href = item.url; go.target = '_blank'; go.rel = 'noopener';
      card.appendChild(go);
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    main.appendChild(wrap);
  });

  /* Editor notes (trusted content authored by the generator) */
  var nb = document.getElementById('notes-body');
  data.editor_notes.forEach(function (note) {
    var p = document.createElement('p');
    p.innerHTML = note;
    nb.appendChild(p);
  });

  /* Carimbo */
  var cg = document.getElementById('carimbo-grid');
  [
    ['Projeto', 'Boletim diário AEC'],
    ['Prancha', data.meta.sheet + ' · ' + data.meta.revision],
    ['Data de emissão', data.meta.date],
    ['Fontes', data.meta.sources_active + ' ativas / ' + data.meta.sources_polled + ' consultadas'],
    ['Notícias', String(data.meta.story_count)],
    ['Gerado por', 'AEC News Daily Skill']
  ].forEach(function (c) {
    var cell = el('div', 'carimbo-cell');
    cell.appendChild(el('div', 'k mono', c[0]));
    cell.appendChild(el('div', 'v', c[1]));
    cg.appendChild(cell);
  });
  var rb = document.getElementById('revs-body');
  data.revisions.forEach(function (r) {
    var tr = document.createElement('tr');
    tr.appendChild(el('td', null, r.rev));
    tr.appendChild(el('td', null, r.date));
    var td = el('td', 'desc', r.desc);
    tr.appendChild(td);
    rb.appendChild(tr);
  });

  /* Legend / filters */
  var legend = document.getElementById('legend');
  var active = 'all';
  function makeBtn(id, name, count, catVar) {
    var b = el('button', 'lg-btn mono');
    b.type = 'button';
    b.dataset.cat = id;
    b.setAttribute('aria-pressed', id === 'all' ? 'true' : 'false');
    if (catVar) {
      b.style.setProperty('--cat', catVar);
      b.appendChild(el('i', 'sw'));
    }
    b.appendChild(document.createTextNode(name));
    if (count != null) b.appendChild(el('span', 'lg-count', ' ' + String(count).padStart(2, '0')));
    b.addEventListener('click', function () { setFilter(id); });
    return b;
  }
  legend.appendChild(makeBtn('all', 'Todas as camadas', null, null));
  data.sections.forEach(function (sec) {
    legend.appendChild(makeBtn(sec.id, sec.code + ' — ' + sec.name, sec.items.length, 'var(' + CAT[sec.id] + ')'));
  });
  function setFilter(id) {
    active = id;
    legend.querySelectorAll('.lg-btn').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.cat === id));
    });
    main.querySelectorAll('section').forEach(function (s) {
      s.style.display = (id === 'all' || s.dataset.cat === id) ? '' : 'none';
    });
  }
})();
</script>
